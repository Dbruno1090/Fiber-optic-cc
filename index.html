<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>Fiber Optic CC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiber CC">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bar:#212121; --bar-ink:#fff;
  --page:#e4e4e4; --row:#c9c9c9; --row-alt:#d4d4d4; --row-ink:#111;
  --line:#9a9a9a; --open:#f2f2f2; --hit:#fff59d;
  --fab:#eeeeee; --fab-ink:#222; --muted:#555;
  --font:Roboto,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#1b1b1b; --row:#2d2d2d; --row-alt:#353535; --row-ink:#eee;
    --line:#4a4a4a; --open:#242424; --hit:#5c5214;
    --fab:#3a3a3a; --fab-ink:#fff; --muted:#aaa;
  }
}
:root[data-theme="dark"]{
  --page:#1b1b1b; --row:#2d2d2d; --row-alt:#353535; --row-ink:#eee;
  --line:#4a4a4a; --open:#242424; --hit:#5c5214;
  --fab:#3a3a3a; --fab-ink:#fff; --muted:#aaa;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--row-ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2979ff;outline-offset:-3px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);
  display:flex;align-items:center;height:56px;padding:0 4px 0 16px;box-shadow:0 2px 4px rgba(0,0,0,.35)}
header h1{flex:1;margin:0;font-size:20px;font-weight:500;letter-spacing:.01em}
.icon{background:none;border:0;width:48px;height:48px;display:grid;place-items:center;cursor:pointer;border-radius:50%;color:var(--bar-ink)}
.icon svg{width:24px;height:24px;fill:currentColor}

#searchbar{display:none;flex:1;gap:8px;align-items:center}
header.searching h1{display:none}
header.searching #searchbar{display:flex}
#q{flex:1;min-width:0;height:38px;border:0;border-radius:4px;padding:0 10px;font-size:18px;background:#fff;color:#111}

#result{display:none;background:var(--bar);color:#fff;padding:10px 16px 12px;font-size:15px;line-height:1.45;border-top:1px solid #444}
#result.show{display:block}
#result b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}

ul{list-style:none;margin:0;padding:0 0 110px}
li.bnd{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 4px;background:var(--bar);color:#fff;font-size:16px;font-weight:600;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:2}
li.bnd .rng{font-weight:400;opacity:.75}
.rowbtn .bt{display:inline-flex;align-items:center;gap:4px}
li.grp{border-bottom:1px solid var(--line)}
.rowbtn{display:flex;align-items:center;width:100%;min-height:44px;padding:4px 10px 4px 4px;border:0;background:var(--row);text-align:left;cursor:pointer;font-size:19px;gap:10px}
li.grp.alt .rowbtn{background:var(--row-alt)}
li.grp.open .rowbtn{background:var(--open)}
.rowbtn .num{min-width:2.4em;text-align:right}
.rowbtn .rng{color:var(--row-ink)}
.rowbtn .chev{margin-left:auto;opacity:.5;transition:transform .15s}
li.grp.open .chev{transform:rotate(90deg)}

.sw{position:relative;flex:none;width:64px;height:30px;border:1px solid #000;display:flex;justify-content:center;align-items:stretch;gap:6px;overflow:hidden}
.sw.sm{width:44px;height:24px;gap:4px}
.sw i{width:7px;display:block}
.sw.sm i{width:5px}
.sw .badge{position:absolute;right:2px;bottom:1px;font-size:11px;font-weight:700;font-style:normal;line-height:1}

.fibers{display:none;background:var(--open);padding:2px 0 6px}
li.grp.open .fibers{display:block}
.fib{display:flex;align-items:center;gap:12px;padding:5px 12px 5px 34px;font-size:17px}
.fib .pos{min-width:1.6em;text-align:right;font-weight:600}
.fib .abs{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.fib.hit{background:var(--hit)}

.fabwrap{position:fixed;right:0;bottom:0;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px)) 0;z-index:6;pointer-events:none}
.fab{pointer-events:auto;width:60px;height:60px;border-radius:50%;border:1px solid rgba(0,0,0,.25);background:var(--fab);color:var(--fab-ink);
  font-size:24px;font-weight:700;font-style:italic;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.4)}

#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:20;background:#fff;color:#111;min-width:260px;max-width:calc(100% - 16px);
  border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.45);padding:8px 0;display:none}
#menu.show{display:block}
#menu .item{padding:10px 16px}
#menu label{display:block;font-size:13px;color:#555;margin-bottom:6px}
.seg{display:flex;border:1px solid #888;border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:8px 4px;cursor:pointer;font-size:15px;color:#111}
.seg button+button{border-left:1px solid #888}
.seg button.on{background:#212121;color:#fff}
#menu select{width:100%;font-size:16px;padding:6px;border:1px solid #888;border-radius:4px;background:#fff;color:#111}
#menu .note{font-size:12px;color:#666;line-height:1.4;padding:8px 16px 4px;border-top:1px solid #ddd;margin-top:6px}
#scrim{position:fixed;inset:0;z-index:15;display:none}
#scrim.show{display:block}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hdr">
  <h1>Fiber Optic CC</h1>
  <div id="searchbar">
    <input id="q" type="number" inputmode="numeric" min="1" placeholder="Fiber #" aria-label="Fiber number">
  </div>
  <button class="icon" id="searchBtn" aria-label="Find fiber number">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </button>
  <button class="icon" id="menuBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
  </button>
</header>
<div id="result" aria-live="polite"></div>

<ul id="list"></ul>

<div class="fabwrap"><button class="fab" id="fab" aria-label="Fibers per group">12</button></div>

<div id="scrim"></div>
<div id="menu" role="dialog" aria-label="Settings">
  <div class="item"><label>Cable type</label>
    <div class="seg" id="segType"><button data-v="ribbon">Ribbon</button><button data-v="loose">Loose tube</button></div></div>
  <div class="item" id="binderItem"><label>Tubes per binder</label>
    <div class="seg" id="segBinder"><button data-v="0">None</button><button data-v="6">6</button><button data-v="12">12</button></div></div>
  <div class="item"><label id="sizeLbl">Fibers per group</label>
    <div class="seg" id="segSize"><button data-v="6">6</button><button data-v="12">12</button><button data-v="24">24</button></div></div>
  <div class="item"><label>Cable count</label>
    <select id="count"></select></div>
  <div class="item"><label>Theme</label>
    <div class="seg" id="segTheme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
  <div class="note">TIA-598 colors. Without binders, tubes/ribbons 13–24 carry one tracer, 25–36 two, and so on. With binders, tube colors restart at Blue in each binder. Past 24, marking varies by manufacturer, so check the jacket print.</div>
</div>
<div id="toast"></div>

<script>
const COLORS=[
 const COLORS=[
 ["Blue","#1f4fd1"],["Orange","#ff7a00"],["Green","#00a651"],["Brown","#7b4a1f"],
 ["Slate","#8e9aa6"],["White","#ffffff"],["Red","#e31b23"],["Black","#000000"],
 ["Yellow","#ffd800"],["Violet","#7d2eb8"],["Rose","#f48fb1"],["Aqua","#00c2d1"]];
const COUNTS=[12,24,48,72,96,144,192,216,288,360,432,576,864,1728,3456];

const S={type:"ribbon",binder:0,size:12,count:864,theme:"auto"};
try{Object.assign(S,JSON.parse(localStorage.getItem("fcc")||"{}"))}catch(e){}
if(S.name){S.type=S.name==="Ribbon"?"ribbon":"loose";delete S.name;}
const gname=()=>S.type==="ribbon"?"Ribbon":"Tube";
const useBinder=()=>S.type==="loose"&&S.binder>0;
// absolute group g -> {b: binder# or 0, t: position shown, tc: tube code}
function grp(g){
  if(useBinder()){const b=Math.ceil(g/S.binder),t=g-(b-1)*S.binder;return{b,t,tc:code(t)};}
  return{b:0,t:g,tc:code(g)};
}
const save=()=>{try{localStorage.setItem("fcc",JSON.stringify(S))}catch(e){}};

// idx is 1-based position in a 12-color cycle; tracers = how many repeats past the first 12
function code(n){const c=COLORS[(n-1)%12];return{name:c[0],hex:c[1],tr:Math.floor((n-1)/12)};}
function tracerColor(hex){return hex==="#000000"?"#ffffff":"#000000";}
function label(c){
  if(!c.tr)return c.name;
  const t=c.hex==="#000000"?"White":"Black";
  return c.name+"/"+t+(c.tr>1?" ×"+c.tr:"");
}
function swatch(c,small){
  const tc=tracerColor(c.hex);
  const bars=Math.min(c.tr,4);
  let h=`<span class="sw${small?" sm":""}" style="background:${c.hex}">`;
  for(let i=0;i<bars;i++)h+=`<i style="background:${tc}"></i>`;
  if(c.tr>4)h+=`<em class="badge" style="color:${tc}">${c.tr}</em>`;
  return h+"</span>";
}

const list=document.getElementById("list");
function render(){
  document.documentElement.toggleAttribute("data-theme",S.theme!=="auto");
  if(S.theme!=="auto")document.documentElement.setAttribute("data-theme",S.theme);
  document.getElementById("fab").textContent=S.size;
  const groups=Math.ceil(S.count/S.size);
  let h="";
  const per=S.binder*S.size;
  for(let g=1;g<=groups;g++){
    const a=(g-1)*S.size+1,z=Math.min(g*S.size,S.count),G=grp(g);
    if(G.b&&G.t===1){
      const ba=(G.b-1)*per+1,bz=Math.min(G.b*per,S.count);
      h+=`<li class="bnd">${swatch(code(G.b))}<span>Binder ${G.b} ${label(code(G.b))}</span><span class="rng">(${ba}-${bz})</span></li>`;
    }
    h+=`<li class="grp${g%2?"":" alt"}" id="g${g}"><button class="rowbtn" aria-expanded="false">${swatch(G.tc)}<span class="num">${G.t})</span><span class="rng">${gname()}=${G.t} (${a}-${z})</span><span class="chev">›</span></button><div class="fibers"></div></li>`;
  }
  list.innerHTML=h;
  syncMenu();
}
function fillFibers(li){
  const g=+li.id.slice(1),box=li.querySelector(".fibers");
  if(box.childElementCount)return;
  let h="";const a=(g-1)*S.size;
  for(let p=1;p<=S.size&&a+p<=S.count;p++){
    const c=code(p);
    h+=`<div class="fib" data-abs="${a+p}">${swatch(c,true)}<span class="pos">${p}</span><span>${label(c)}</span><span class="abs">#${a+p}</span></div>`;
  }
  box.innerHTML=h;
}
list.addEventListener("click",e=>{
  const btn=e.target.closest(".rowbtn");if(!btn)return;
  const li=btn.parentElement;fillFibers(li);
  const open=li.classList.toggle("open");btn.setAttribute("aria-expanded",open);
});

// search
const hdr=document.getElementById("hdr"),q=document.getElementById("q"),res=document.getElementById("result");
document.getElementById("searchBtn").onclick=()=>{
  if(hdr.classList.contains("searching")&&q.value){find();return;}
  hdr.classList.toggle("searching");
  if(hdr.classList.contains("searching"))q.focus();else{res.classList.remove("show");q.value="";}
};
q.addEventListener("keydown",e=>{if(e.key==="Enter")find();if(e.key==="Escape"){hdr.classList.remove("searching");res.classList.remove("show");}});
function find(){
  const n=parseInt(q.value,10);
  if(!n||n<1||n>S.count){res.innerHTML=`Enter a fiber number from 1 to ${S.count}.`;res.classList.add("show");return;}
  const g=Math.ceil(n/S.size),p=n-(g-1)*S.size,G=grp(g),fc=code(p);
  const bl=G.b?`<span class="chip">${swatch(code(G.b),true)} Binder ${G.b}: ${label(code(G.b))}</span><br>`:"";
  res.innerHTML=`<b>Fiber ${n}</b><br>${bl}<span class="chip">${swatch(G.tc,true)} ${gname()} ${G.t}: ${label(G.tc)}</span><br><span class="chip">${swatch(fc,true)} Fiber ${p}: ${label(fc)}</span>`;
  res.classList.add("show");
  document.querySelectorAll(".fib.hit").forEach(x=>x.classList.remove("hit"));
  const li=document.getElementById("g"+g);fillFibers(li);
  li.classList.add("open");li.querySelector(".rowbtn").setAttribute("aria-expanded","true");
  const f=li.querySelector(`.fib[data-abs="${n}"]`);f.classList.add("hit");
  li.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
  q.blur();
}

// FAB cycles fibers per group
const toast=document.getElementById("toast");let tt;
function say(t){toast.textContent=t;toast.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("show"),1400);}
document.getElementById("fab").onclick=()=>{
  S.size={12:24,24:6,6:12}[S.size];save();render();res.classList.remove("show");
  say(S.size+" fibers per "+gname().toLowerCase());
};

// menu
const menu=document.getElementById("menu"),scrim=document.getElementById("scrim"),sel=document.getElementById("count");
sel.innerHTML=COUNTS.map(c=>`<option value="${c}">${c} ct</option>`).join("");
function syncMenu(){
  for(const[id,v]of[["segType",S.type],["segBinder",String(S.binder)],["segSize",String(S.size)],["segTheme",S.theme]])
    document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.getElementById("binderItem").style.display=S.type==="loose"?"":"none";
  document.getElementById("sizeLbl").textContent=S.type==="loose"?"Fibers per tube":"Fibers per ribbon";
  document.querySelector("#hdr h1").textContent=S.type==="loose"?"Loose Tube CC":"Fiber Optic CC";
  if(!COUNTS.includes(+S.count))S.count=864;
  sel.value=S.count;
}
const closeMenu=()=>{menu.classList.remove("show");scrim.classList.remove("show");};
document.getElementById("menuBtn").onclick=()=>{menu.classList.add("show");scrim.classList.add("show");};
scrim.onclick=closeMenu;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});
function seg(id,key,num){document.getElementById(id).addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;S[key]=num?+b.dataset.v:b.dataset.v;save();render();res.classList.remove("show");});}
seg("segType","type");seg("segBinder","binder",true);seg("segSize","size",true);seg("segTheme","theme");
sel.onchange=()=>{S.count=+sel.value;save();render();res.classList.remove("show");};

render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
